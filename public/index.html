<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The clamk-tools theme, applied before first paint as on the hub: the choice shared under
         clamk-tools:theme, otherwise the system setting. App.tsx takes over once it has loaded. -->
    <script>
      try {
        var t = localStorage.getItem("clamk-tools:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style id="clamk-theme">
      html {
        background: #fbfcfc;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background: #15181a;
          color-scheme: dark;
        }
      }
      html[data-theme="dark"] {
        background: #15181a;
        color-scheme: dark;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
