name: Privacy guard (pull requests)

# The deploy workflow checks pushes to main. This one checks the commits and files a pull request adds.

on:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the commits the PR adds, and every file
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          sh .githooks/check-privacy.sh "$BASE..$HEAD"
          sh .githooks/check-privacy.sh --tree
